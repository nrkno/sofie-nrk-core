name: "Prune container images"

on:
  workflow_dispatch:
  schedule:
    - cron: "12 14 * * *"

permissions:
  packages: write

permissions:
  contents: read
  packages: write
  
jobs:
  prune-container-images:
    if: ${{ github.repository_owner == 'nrkno' }}
    
    uses: nrkno/sofie-nrk-github-workflows/.github/workflows/prune-container-images.yml@main
    strategy:
      max-parallel: 1
      matrix:
        repo: [server-core, playout-gateway, mos-gateway]
    with:
      dry-run: false
      prune-untagged: true
      keep-younger-than: 90
      package-name: sofie-nrk-core-${{ matrix.repo }}
