name: "Prune container images"

on:
  workflow_dispatch:
  schedule:
    - cron: "12 14 * * *"

jobs:
  prune-container-images-sofie:
    if: ${{ github.repository_owner == 'nrkno' }}
    uses: nrkno/sofie-nrk-github-workflows/.github/workflows/prune-container-images.yml@508f81564e6233f30ae776f63f19f7976b05669f # main
    strategy:
      max-parallel: 1
      matrix:
        repo: [server-core, playout-gateway, mos-gateway]
    with:
      dry-run: false
      prune-untagged: true
      keep-younger-than: 90
      package-name: sofie-nrk-core-${{ matrix.repo }}
